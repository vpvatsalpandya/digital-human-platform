# Netlify build configuration.
#
# The Next.js runtime is declared explicitly rather than left to auto-detection:
# without it the build publishes .next as static files and every route 404s.
# It turns the App Router's dynamic routes into a Netlify function and the
# tenant middleware into an edge function. Response headers (security headers
# and the immutable cache on /assets/*) stay in next.config.mjs so they apply
# identically on every host we deploy to.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The geometry packs are served straight off the CDN, so next.config.mjs's
# headers() never sees them: the immutable cache has to be declared here too,
# or 9.8 MB of meshes is revalidated on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"
