# Local stack: postgres (pgvector + btree_gist), redis, minio (S3-compatible assets), web.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: vesalia }
    ports: ['5432:5432']
    volumes: ['pg:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ['9000:9000', '9001:9001']
  web:
    build: { context: .., dockerfile: infra/Dockerfile }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vesalia
      REDIS_URL: redis://redis:6379
      DEFAULT_TENANT_SLUG: demo
    ports: ['3000:3000']
    depends_on: [postgres, redis]
volumes: { pg: {} }
